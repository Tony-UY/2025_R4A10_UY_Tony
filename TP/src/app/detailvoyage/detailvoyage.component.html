<div class="voyage-detail bg-gray-100 py-12">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-4">{{ voyage?.destination }}</h2>
    <hr class="border-gray-300 mb-6 w-20 mx-auto">
    <p class="text-center text-gray-600 max-w-2xl mx-auto mb-8">{{ voyage?.description }}</p>
    <p class="text-blue-600 font-semibold text-center mb-4">{{ voyage?.prix | currency: 'EUR' }}</p>
    <div class="text-center">
      <button (click)="deleteVoyage(voyage?.id)" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition-colors">
        Supprimer
      </button>
    </div>
  </div>
</div>
