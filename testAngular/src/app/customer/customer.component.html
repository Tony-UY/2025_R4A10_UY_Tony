<section class="customer-section">
  <div class="testimonial-box">
    <h2>What our customers are saying</h2>
    <hr>
    <div class="testimonial">
      <img [src]="testimonials[currentIndex].image" [alt]="testimonials[currentIndex].name" class="customer-img">
      <div class="testimonial-text">
        <h4>{{ testimonials[currentIndex].name }}</h4>
        <p class="role">{{ testimonials[currentIndex].role }}</p>
        <p class="review">"{{ testimonials[currentIndex].review }}"</p>
      </div>
    </div>
    <div class="controls">
      <button (click)="prevSlide()">&#8592;</button>
      <div class="dots">
        <span *ngFor="let i of [0, 1, 2]" [class.active]="i === currentIndex" (click)="goToSlide(i)"></span>
      </div>
      <button (click)="nextSlide()">&#8594;</button>
    </div>
  </div>
</section>
